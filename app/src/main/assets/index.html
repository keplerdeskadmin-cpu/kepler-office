<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kepler Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0f1733; --navy2:#1b2550; --ink:#1d2333; --mute:#6a7186; --line:#dfe3ec; --bg:#eef1f7; --white:#fff;
  --write:#2f6fed; --sheets:#1e9e63; --slides:#e8692c; --accent:var(--write);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
button,select,input{font:inherit}
.hidden{display:none!important}

/* ---------- Top bar ---------- */
.topbar{height:48px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:0 16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px;cursor:pointer;user-select:none}
.brand svg{width:26px;height:26px}
.app-name{font-weight:500;opacity:.85;padding-left:14px;border-left:1px solid rgba(255,255,255,.2)}
.doc-title{background:transparent;border:1px solid transparent;color:#fff;border-radius:6px;padding:4px 8px;min-width:180px}
.doc-title:hover,.doc-title:focus{border-color:rgba(255,255,255,.3);outline:none;background:rgba(255,255,255,.06)}
.spacer{flex:1}
.saved{font-size:12px;opacity:.7}
.topbtn{background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px}
.topbtn:hover{background:rgba(255,255,255,.2)}

/* ---------- Home ---------- */
.home{min-height:calc(100% - 48px);background:radial-gradient(1200px 500px at 70% -10%,#2a3a7a 0%,var(--navy) 55%);color:#fff;padding:56px 24px}
.home-inner{max-width:980px;margin:0 auto}
.home h1{font-size:40px;margin:0 0 6px;font-weight:700}
.home p.lead{opacity:.75;margin:0 0 40px;font-size:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.tile{background:#fff;color:var(--ink);border-radius:14px;padding:22px;cursor:pointer;border:0;text-align:left;transition:transform .15s,box-shadow .15s;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.tile:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(0,0,0,.35)}
.tile .ic{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:22px;margin-bottom:16px}
.tile h3{margin:0 0 6px;font-size:19px}
.tile p{margin:0;color:var(--mute);font-size:14px;line-height:1.5}
.home-foot{margin-top:40px;font-size:13px;opacity:.6}

/* ---------- Ribbon ---------- */
.ribbon{background:#fff;border-bottom:1px solid var(--line);padding:6px 10px;display:flex;flex-wrap:wrap;align-items:center;gap:4px;position:sticky;top:0;z-index:5}
.ribbon .grp{display:flex;align-items:center;gap:2px;padding:0 6px;border-right:1px solid var(--line)}
.ribbon .grp:last-child{border-right:0}
.rb{border:0;background:transparent;min-width:32px;height:32px;border-radius:6px;cursor:pointer;color:var(--ink);font-size:14px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.rb:hover{background:#eef2fb}
.rb.on{background:#dfe8fd;color:var(--accent)}
.rb.primary{background:var(--accent);color:#fff;font-weight:600}
.rb.primary:hover{filter:brightness(1.08)}
.ribbon select{height:30px;border:1px solid var(--line);border-radius:6px;padding:0 6px;background:#fff}
.colorbtn{position:relative;overflow:hidden}
.colorbtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.colorbtn .bar{position:absolute;left:7px;right:7px;bottom:4px;height:3px;border-radius:2px}

/* ---------- Write ---------- */
.write-wrap{height:calc(100% - 48px - 46px - 28px);overflow:auto;padding:32px 16px}
.page{background:#fff;max-width:816px;min-height:1056px;margin:0 auto;padding:72px 84px;box-shadow:0 2px 10px rgba(20,30,60,.12);outline:none;font-family:Merriweather,Georgia,serif;font-size:15px;line-height:1.7}
.page h1{font-family:Inter,sans-serif;font-size:30px;margin:.4em 0}
.page h2{font-family:Inter,sans-serif;font-size:22px;margin:.6em 0 .3em}
.page h3{font-family:Inter,sans-serif;font-size:18px}
.page table{border-collapse:collapse;width:100%;margin:10px 0}
.page td,.page th{border:1px solid #b9c0d0;padding:6px 8px;min-width:40px}
.page img{max-width:100%}
.page blockquote{border-left:4px solid var(--write);margin:10px 0;padding:4px 14px;color:#4b5266;background:#f5f8ff}
.status{height:28px;background:var(--navy2);color:#cfd6ec;font-size:12px;display:flex;align-items:center;gap:18px;padding:0 14px}

/* ---------- Sheets ---------- */
.fbar{display:flex;align-items:center;gap:8px;background:#fff;border-bottom:1px solid var(--line);padding:6px 10px}
.fbar .ref{width:70px;text-align:center;font-weight:600;border:1px solid var(--line);border-radius:6px;padding:4px}
.fbar .fx{color:var(--mute);font-style:italic;font-family:Georgia,serif}
.fbar input.formula{flex:1;border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.grid-wrap{height:calc(100% - 48px - 46px - 42px - 28px);overflow:auto;background:#fff}
table.grid{border-collapse:collapse;table-layout:fixed;font-size:13px}
table.grid{width:max-content}
table.grid th:not(.rh){width:100px;min-width:100px}
table.grid th{background:#f3f5f9;color:#555d70;font-weight:500;border:1px solid #d7dbe5;position:sticky;top:0;z-index:2;height:24px}
table.grid th.rh{position:sticky;left:0;z-index:1;width:44px}
table.grid th.corner{left:0;z-index:3}
table.grid td{border:1px solid #e3e6ee;height:24px;width:100px;max-width:100px;padding:0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:cell}
table.grid td.sel{outline:2px solid var(--sheets);outline-offset:-2px;background:#eefaf3}
table.grid td.inrange{background:#e3f5ea}
table.grid td.num{text-align:right}
table.grid td.err{color:#c62828}
table.grid td input{width:100%;border:0;outline:none;height:22px;padding:0;font:inherit;background:transparent}
th.hl{background:#d6efe1!important;color:var(--sheets)!important;font-weight:600!important}

/* ---------- Slides ---------- */
.slides-body{display:flex;height:calc(100% - 48px - 46px - 28px)}
.thumbs{width:200px;background:#f7f8fb;border-right:1px solid var(--line);overflow:auto;padding:12px}
.thumb{position:relative;margin-bottom:12px;cursor:pointer}
.thumb .n{position:absolute;left:-2px;top:2px;font-size:11px;color:var(--mute)}
.thumb .mini{margin-left:14px;aspect-ratio:16/9;border-radius:6px;border:2px solid transparent;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.12);position:relative}
.thumb.active .mini{border-color:var(--slides)}
.mini .inner{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0;pointer-events:none}
.stage{flex:1;display:grid;place-items:center;overflow:auto;padding:24px;background:#e6e9f0}
.slide-frame{width:min(100%,960px);aspect-ratio:16/9;position:relative;box-shadow:0 6px 24px rgba(0,0,0,.18);border-radius:4px;overflow:hidden}
.slide{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0;padding:60px 70px;display:flex;flex-direction:column}
.slide .s-title{font-size:44px;font-weight:700;outline:none;line-height:1.15;min-height:52px}
.slide .s-body{font-size:24px;outline:none;line-height:1.5;margin-top:24px;flex:1}
.slide.layout-title{justify-content:center;align-items:center;text-align:center}
.slide.layout-title .s-title{font-size:58px}
.slide.layout-title .s-body{flex:0;font-size:26px;opacity:.85}
.slide [contenteditable]:empty:before{content:attr(data-ph);opacity:.4}
.theme-light{background:#fff;color:#1d2333}
.theme-dark{background:linear-gradient(135deg,#0f1733,#26336b);color:#fff}
.theme-sunset{background:linear-gradient(135deg,#ff7a45,#c2185b);color:#fff}
.theme-ocean{background:linear-gradient(135deg,#00a6a6,#1e40af);color:#fff}
.theme-paper{background:#fbf6ea;color:#3b2f20}
.theme-light .s-title{color:var(--slides)}
.notes{height:80px;border-top:1px solid var(--line);background:#fff}
.present{position:fixed;inset:0;background:#000;z-index:100;display:grid;place-items:center}
.present .slide-frame{width:min(100vw,177.78vh);box-shadow:none;border-radius:0}
.present .pctl{position:fixed;bottom:16px;right:16px;color:#fff;opacity:.6;font-size:13px}

/* ---------- Dialog ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(10,15,35,.45);display:grid;place-items:center;z-index:200}
.modal{background:#fff;border-radius:12px;padding:22px;width:min(92vw,440px);box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{margin:0 0 10px}
.modal input,.modal textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;margin:6px 0 14px}
.modal textarea{height:180px;font-family:ui-monospace,monospace;font-size:12px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 14px;cursor:pointer}
.btn.pri{background:var(--accent);color:#fff;border-color:transparent}
.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;z-index:300;box-shadow:0 8px 24px rgba(0,0,0,.3)}
@media print{ .topbar,.ribbon,.status,section:not(#v-write){display:none!important} .write-wrap{height:auto;overflow:visible;padding:0} .page{box-shadow:none;max-width:none;min-height:0;padding:0} body{background:#fff} }
.credit{margin-top:8px;font-size:12px;opacity:.5}

/* flexible layout (desktop + mobile) */
#v-write,#v-sheets,#v-slides{height:calc(100% - 48px)!important;display:flex;flex-direction:column}
#v-write.hidden,#v-sheets.hidden,#v-slides.hidden{display:none!important}
.write-wrap,.grid-wrap,.slides-body{flex:1;min-height:0;height:auto!important}
@media (max-width:760px){
  .ribbon{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .ribbon::-webkit-scrollbar{display:none}
  .ribbon .grp{flex-shrink:0}
  .topbar{gap:8px;padding:0 10px}
  .brand span.bt,.app-name{display:none}
  .doc-title{min-width:0;flex:1;width:100%}
  .saved{display:none}
  .page{padding:28px 20px;min-height:70vh;font-size:15px}
  .write-wrap{padding:12px 8px}
  .home{padding:32px 16px}.home h1{font-size:28px}
  .slides-body{flex-direction:column-reverse}
  .thumbs{width:auto;height:96px;display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;border-right:0;border-top:1px solid var(--line);padding:8px}
  .thumb{margin:0;flex:0 0 130px}
  .stage{padding:12px}
}
</style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <div class="brand" id="goHome" title="Home">
    <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="8" fill="#ffc94d"/><ellipse cx="16" cy="16" rx="14" ry="5" fill="none" stroke="#8fb4ff" stroke-width="2" transform="rotate(-20 16 16)"/><circle cx="27" cy="11" r="2" fill="#fff"/></svg>
    <span class="bt">Kepler Office</span>
  </div>
  <div class="app-name hidden" id="appName"></div>
  <input class="doc-title hidden" id="docTitle" value="Untitled">
  <div class="spacer"></div>
  <span class="saved hidden" id="savedLbl">Saved</span>
</div>

<!-- HOME -->
<section id="v-home" class="home">
  <div class="home-inner">
    <h1>Welcome to Kepler Office</h1>
    <p class="lead">Write documents, crunch numbers and build presentations — all in your browser.</p>
    <div class="tiles">
      <button class="tile" data-go="write"><div class="ic" style="background:var(--write)">W</div><h3>Kepler Write</h3><p>A full document editor — formatting, headings, lists, tables and images.</p></button>
      <button class="tile" data-go="sheets"><div class="ic" style="background:var(--sheets)">S</div><h3>Kepler Sheets</h3><p>Spreadsheets with formulas (SUM, AVERAGE, IF…), formatting and CSV import.</p></button>
      <button class="tile" data-go="slides"><div class="ic" style="background:var(--slides)">P</div><h3>Kepler Slides</h3><p>Presentations with themes, layouts and full-screen present mode.</p></button>
    </div>
    <div class="home-foot">Your work is saved automatically in this browser. 100% free — no sign-up required.</div>
  </div>
</section>

<!-- WRITE -->
<section id="v-write" class="hidden" style="height:100%">
  <div class="ribbon" id="wRibbon">
    <div class="grp">
      <button class="rb" data-act="new" title="New document">＋ New</button>
      <button class="rb" data-act="open" title="Open file (.html/.txt)">📂 Open</button>
      <button class="rb" data-act="export" title="Download / copy">⬇ Export</button>
      <button class="rb" data-act="print" title="Print / PDF">🖨 Print</button>
    </div>
    <div class="grp">
      <button class="rb" data-cmd="undo" title="Undo (Ctrl+Z)">↶</button>
      <button class="rb" data-cmd="redo" title="Redo (Ctrl+Y)">↷</button>
    </div>
    <div class="grp">
      <select id="wBlock" title="Style">
        <option value="P">Normal</option><option value="H1">Heading 1</option><option value="H2">Heading 2</option><option value="H3">Heading 3</option><option value="BLOCKQUOTE">Quote</option>
      </select>
      <select id="wFont" title="Font">
        <option>Merriweather</option><option>Inter</option><option>Georgia</option><option>Arial</option><option>Times New Roman</option><option>Courier New</option>
      </select>
      <select id="wSize" title="Size">
        <option value="1">8</option><option value="2">10</option><option value="3" selected>12</option><option value="4">14</option><option value="5">18</option><option value="6">24</option><option value="7">36</option>
      </select>
    </div>
    <div class="grp">
      <button class="rb" data-cmd="bold" title="Bold (Ctrl+B)"><b>B</b></button>
      <button class="rb" data-cmd="italic" title="Italic (Ctrl+I)"><i>I</i></button>
      <button class="rb" data-cmd="underline" title="Underline (Ctrl+U)"><u>U</u></button>
      <button class="rb" data-cmd="strikeThrough" title="Strikethrough"><s>S</s></button>
      <label class="rb colorbtn" title="Text color">A<span class="bar" id="fcBar" style="background:#d32f2f"></span><input type="color" id="wFore" value="#d32f2f"></label>
      <label class="rb colorbtn" title="Highlight">🖍<span class="bar" id="hcBar" style="background:#ffeb3b"></span><input type="color" id="wHi" value="#ffeb3b"></label>
    </div>
    <div class="grp">
      <button class="rb" data-cmd="justifyLeft" title="Left">⯇</button>
      <button class="rb" data-cmd="justifyCenter" title="Center">≡</button>
      <button class="rb" data-cmd="justifyRight" title="Right">⯈</button>
      <button class="rb" data-cmd="justifyFull" title="Justify">☰</button>
    </div>
    <div class="grp">
      <button class="rb" data-cmd="insertUnorderedList" title="Bullets">• List</button>
      <button class="rb" data-cmd="insertOrderedList" title="Numbering">1. List</button>
      <button class="rb" data-cmd="outdent" title="Outdent">⇤</button>
      <button class="rb" data-cmd="indent" title="Indent">⇥</button>
    </div>
    <div class="grp">
      <button class="rb" data-act="table" title="Insert table">▦ Table</button>
      <button class="rb" data-act="image" title="Insert image">🖼 Image</button>
      <button class="rb" data-act="link" title="Link">🔗</button>
      <button class="rb" data-cmd="insertHorizontalRule" title="Line">―</button>
      <button class="rb" data-cmd="removeFormat" title="Clear formatting">⌫ Clear</button>
    </div>
    <div class="grp">
      <button class="rb" data-act="rtl" title="Urdu / RTL direction">↔ RTL</button>
    </div>
  </div>
  <div class="write-wrap"><div class="page" id="page" contenteditable="true" spellcheck="true"></div></div>
  <div class="status"><span id="wWords">0 words</span><span id="wChars">0 characters</span><span class="spacer"></span><span>Kepler Write</span></div>
</section>

<!-- SHEETS -->
<section id="v-sheets" class="hidden" style="height:100%">
  <div class="ribbon" style="--accent:var(--sheets)">
    <div class="grp">
      <button class="rb" data-sact="new">＋ New</button>
      <button class="rb" data-sact="open" title="CSV import">📂 Import CSV</button>
      <button class="rb" data-sact="export" title="Export as CSV">⧉ Export CSV</button>
    </div>
    <div class="grp">
      <button class="rb" data-sfmt="b" title="Bold"><b>B</b></button>
      <button class="rb" data-sfmt="i" title="Italic"><i>I</i></button>
      <label class="rb colorbtn" title="Fill color">🪣<span class="bar" id="sFillBar" style="background:#fff59d"></span><input type="color" id="sFill" value="#fff59d"></label>
      <label class="rb colorbtn" title="Text color">A<span class="bar" id="sColBar" style="background:#1565c0"></span><input type="color" id="sCol" value="#1565c0"></label>
    </div>
    <div class="grp">
      <button class="rb" data-sfmt="al" title="Left">⯇</button>
      <button class="rb" data-sfmt="ac" title="Center">≡</button>
      <button class="rb" data-sfmt="ar" title="Right">⯈</button>
    </div>
    <div class="grp">
      <select id="sNum" title="Number format"><option value="">General</option><option value="2">0.00</option><option value="pct">Percent %</option><option value="pkr">Rs. Currency</option><option value="usd">$ Currency</option></select>
    </div>
    <div class="grp">
      <button class="rb" data-sact="sum" title="AutoSum">Σ AutoSum</button>
      <button class="rb" data-sact="clear" title="Clear">⌫ Clear</button>
      <button class="rb" data-sact="sortA" title="Column A→Z">⇅ Sort</button>
    </div>
  </div>
  <div class="fbar"><input class="ref" id="sRef" readonly value="A1"><span class="fx">fx</span><input class="formula" id="sFormula" placeholder="Enter a value or formula, e.g. =SUM(A1:A5)"></div>
  <div class="grid-wrap" id="gridWrap"><table class="grid" id="grid"></table></div>
  <div class="status" id="sStatus"><span id="sStat">Ready</span><span class="spacer"></span><span>Kepler Sheets</span></div>
</section>

<!-- SLIDES -->
<section id="v-slides" class="hidden" style="height:100%">
  <div class="ribbon" style="--accent:var(--slides)">
    <div class="grp">
      <button class="rb" data-pact="add">＋ New Slide</button>
      <button class="rb" data-pact="dup" title="Duplicate">⧉ Duplicate</button>
      <button class="rb" data-pact="del" title="Delete">🗑 Delete</button>
      <button class="rb" data-pact="up" title="Move up">↑</button>
      <button class="rb" data-pact="down" title="Move down">↓</button>
    </div>
    <div class="grp">
      <select id="pLayout" title="Layout"><option value="content">Title + Content</option><option value="title">Title Slide</option></select>
      <select id="pTheme" title="Theme"><option value="light">Light</option><option value="dark">Kepler Dark</option><option value="sunset">Sunset</option><option value="ocean">Ocean</option><option value="paper">Paper</option></select>
    </div>
    <div class="grp">
      <button class="rb" data-pcmd="bold"><b>B</b></button>
      <button class="rb" data-pcmd="italic"><i>I</i></button>
      <button class="rb" data-pcmd="insertUnorderedList">• List</button>
      <button class="rb" data-pact="img">🖼 Image</button>
    </div>
    <div class="grp">
      <button class="rb primary" data-pact="present">▶ Present</button>
    </div>
  </div>
  <div class="slides-body">
    <div class="thumbs" id="thumbs"></div>
    <div class="stage" id="stage"><div class="slide-frame" id="frame"></div></div>
  </div>
  <div class="status"><span id="pStat">Slide 1 of 1</span><span class="spacer"></span><span>Kepler Slides</span></div>
</section>

<input type="file" id="fileIn" class="hidden">
<div id="modalRoot"></div>

<script>
/* ================= Utilities ================= */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const store = {
  get(k, d){ try{ const v = localStorage.getItem('kepler.'+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('kepler.'+k, JSON.stringify(v)); flashSaved(); }catch(e){} }
};
let savedT;
function flashSaved(){ const l=$('#savedLbl'); l.textContent='Saved ✓'; clearTimeout(savedT); savedT=setTimeout(()=>l.textContent='Saved',1200); }
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function modal({title, fields=[], text=null, okText='OK', onOk, copy=false, dl=null}){
  const root=$('#modalRoot');
  root.innerHTML = `<div class="modal-bg"><div class="modal"><h3>${esc(title)}</h3>
    ${fields.map((f,i)=>`<label style="font-size:13px;color:var(--mute)">${esc(f.label)}</label><input id="mf${i}" value="${esc(f.value||'')}" ${f.type?`type="${f.type}"`:''}>`).join('')}
    ${text!=null?`<textarea id="mtext" readonly>${esc(text)}</textarea>`:''}
    <div class="acts"><button class="btn" id="mCancel">${copy?'Close':'Cancel'}</button>${dl?'<button class="btn" id="mDl">⬇ Download</button>':''}<button class="btn pri" id="mOk">${okText}</button></div></div></div>`;
  const close=()=>root.innerHTML='';
  $('#mCancel').onclick=close;
  if(dl) $('#mDl').onclick=()=>{ download(dl.name, text, dl.type); close(); };

    const b2=rangeBounds();
    if(b2.r2>b2.r1||b2.c2>b2.c1){ const target=colName(b2.c1)+(b2.r2+2); setCell(target,`=SUM(${colName(b2.c1)}${b2.r1+1}:${colName(b2.c2)}${b2.r2+1})`); }
    else { let r=sel.r; while(r>0 && typeof evalId(colName(sel.c)+r)==='number') r--; setCell(colName(sel.c)+(sel.r+1), `=SUM(${colName(sel.c)}${r+1}:${colName(sel.c)}${sel.r})`); }
  }
  if(a==='sortA'){
    const c=colName(sel.c); let maxR=0; Object.keys(cells).forEach(id=>{ if(rawVal(id)!=='') maxR=Math.max(maxR,+id.slice(1)); });
    const hasHeader = isNaN(evalId(c+'1')) && maxR>1; const start=hasHeader?2:1;
    const rows=[]; for(let r=start;r<=maxR;r++){ const row={}; for(let k=0;k<COLS;k++){ const id=colName(k)+r; if(cells[id]) row[colName(k)]=cells[id]; } rows.push({key:evalId(c+r),row}); }
    rows.sort((x,y)=> (isNum(x.key)&&isNum(y.key)) ? x.key-y.key : String(x.key).localeCompare(String(y.key)));
    for(let r=start;r<=maxR;r++) for(let k=0;k<COLS;k++) delete cells[colName(k)+r];
    rows.forEach((o,i)=>Object.entries(o.row).forEach(([col,cell])=>cells[col+(start+i)]=cell));
    saveCells(); renderGrid(); toast('Sorted by column '+c);
  }
  $('#gridWrap').focus();
});

/* ================= SLIDES ================= */
let deck = store.get('slides.deck2', null) || {
  theme:'dark',
  slides:[
    {layout:'title', title:'Kepler Slides', body:'Create your first presentation'},
    {layout:'content', title:'Features', body:'<ul><li>Themes and layouts</li><li>Insert images</li><li>Full-screen Present mode</li><li>Use arrow keys to change slides</li></ul>'}
  ]
};
let cur=0;
const saveDeck = debounce(()=>store.set('slides.deck2', deck), 400);
function slideHTML(s, editable){
  const ce=editable?'contenteditable="true"':'';
  return `<div class="slide theme-${deck.theme} layout-${s.layout}">
    <div class="s-title" ${ce} data-f="title" data-ph="Click to add title">${s.title||''}</div>
    <div class="s-body" ${ce} data-f="body" data-ph="${s.layout==='title'?'Subtitle':'Click to add text'}">${s.body||''}</div></div>`;
}
function fitScale(frame, el){ const w=frame.clientWidth; el.style.transform=`scale(${w/960})`; }
function renderThumbs(){
  $('#thumbs').innerHTML = deck.slides.map((s,i)=>`<div class="thumb ${i===cur?'active':''}" data-i="${i}"><span class="n">${i+1}</span><div class="mini">${slideHTML(s,false).replace('class="slide','class="inner slide')}</div></div>`).join('');
  $$('#thumbs .mini').forEach(m=>fitScale(m, m.firstElementChild));
  $$('#thumbs .thumb').forEach(t=>t.onclick=()=>{ cur=+t.dataset.i; renderSlides(); });
  $('#pStat').textContent=`Slide ${cur+1} of ${deck.slides.length}`;
}
function renderSlides(){
  cur=Math.min(cur,deck.slides.length-1);
  const s=deck.slides[cur], frame=$('#frame');
  frame.innerHTML=slideHTML(s,true);
  const el=frame.firstElementChild; fitScale(frame, el);
  el.querySelectorAll('[contenteditable]').forEach(ed=>ed.addEventListener('input',()=>{ s[ed.dataset.f]=ed.innerHTML; saveDeck(); renderThumbsDebounced(); }));
  $('#pLayout').value=s.layout; $('#pTheme').value=deck.theme;
  renderThumbs();
}
const renderThumbsDebounced=debounce(renderThumbs,300);
window.addEventListener('resize',()=>{ if(current==='slides'){ const f=$('#frame'); if(f.firstElementChild) fitScale(f,f.firstElementChild); } const p=$('.present .slide-frame'); if(p) fitScale(p,p.firstElementChild); });
$('#pLayout').onchange=e=>{ deck.slides[cur].layout=e.target.value; saveDeck(); renderSlides(); };
$('#pTheme').onchange=e=>{ deck.theme=e.target.value; saveDeck(); renderSlides(); };
let pRange=null;
document.addEventListener('selectionchange',()=>{ if(current!=='slides') return; const s=getSelection(); if(s.rangeCount && $('#frame').contains(s.anchorNode)) pRange=s.getRangeAt(0).cloneRange(); });
$$('[data-pcmd]').forEach(b=>{ b.onmousedown=e=>e.preventDefault(); b.onclick=()=>{ document.execCommand(b.dataset.pcmd,false,null); }; });
$$('[data-pact]').forEach(b=>{ b.onmousedown=e=>e.preventDefault(); b.onclick=()=>{
  const a=b.dataset.pact, S=deck.slides;
  if(a==='add'){ S.splice(cur+1,0,{layout:'content',title:'',body:''}); cur++; }
  if(a==='dup'){ S.splice(cur+1,0,JSON.parse(JSON.stringify(S[cur]))); cur++; }
  if(a==='del'){ if(S.length>1){ S.splice(cur,1); cur=Math.max(0,cur-1); } else toast('A presentation needs at least one slide'); }
  if(a==='up' && cur>0){ [S[cur-1],S[cur]]=[S[cur],S[cur-1]]; cur--; }
  if(a==='down' && cur<S.length-1){ [S[cur+1],S[cur]]=[S[cur],S[cur+1]]; cur++; }
  if(a==='img'){ pickFile('image/*', url=>{ S[cur].body=(S[cur].body||'')+`<div><img src="${url}" style="max-height:300px;max-width:100%;border-radius:8px"></div>`; saveDeck(); renderSlides(); }, true); return; }
  if(a==='present'){ present(); return; }
  saveDeck(); renderSlides();
};});
function present(){
  let i=cur;
  const wrap=document.createElement('div'); wrap.className='present'; document.body.appendChild(wrap);
  const draw=()=>{ wrap.innerHTML=`<div class="slide-frame">${slideHTML(deck.slides[i],false)}</div><div class="pctl">${i+1} / ${deck.slides.length} · ← → · Esc</div>`; const f=wrap.firstElementChild; fitScale(f,f.firstElementChild); };
  const key=e=>{
    if(['ArrowRight','ArrowDown',' ','PageDown','Enter'].includes(e.key)){ e.preventDefault(); if(i<deck.slides.length-1){ i++; draw(); } }
    else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){ e.preventDefault(); if(i>0){ i--; draw(); } }
    else if(e.key==='Escape') end();
  };
  const end=()=>{ document.removeEventListener('keydown',key); wrap.remove(); try{ document.fullscreenElement && document.exitFullscreen(); }catch(e){} };
  wrap.onclick=e=>{ if(e.clientX > innerWidth/3){ if(i<deck.slides.length-1){ i++; draw(); } else end(); } else if(i>0){ i--; draw(); } };
  document.addEventListener('keydown',key);
  try{ wrap.requestFullscreen && wrap.requestFullscreen().catch(()=>{}); }catch(e){}
  document.addEventListener('fullscreenchange',function fc(){ if(!document.fullscreenElement){ document.removeEventListener('fullscreenchange',fc); if(document.body.contains(wrap)) end(); } else draw(); });
  draw();
}

/* ================= Start ================= */
show(location.hash.slice(1));
