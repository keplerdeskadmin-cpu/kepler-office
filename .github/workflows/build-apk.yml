name: Build Kepler Office APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk KeplerOffice.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KeplerOffice-APK
          path: KeplerOffice.apk

      - name: Publish download link (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: Kepler Office v1.1.${{ github.run_number }}
          make_latest: true
          files: KeplerOffice.apk
          body: |
            Kepler Office for Android — free office suite (Write, Sheets, Slides).
            Download KeplerOffice.apk below and install it on your phone.
